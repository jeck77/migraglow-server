spring.datasource.url=jdbc:mysql://localhost:3306/migraflow
spring.datasource.username=migraflow
spring.datasource.password=migraflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 로컬 개발 중 static JS/CSS를 고쳐도 브라우저가 캐시된 예전 버전을 계속 쓰는 걸 막는다 —
# 강력 새로고침/캐시 비우기 없이 그냥 새로고침(F5)만 해도 항상 최신 파일을 받아오게 한다.
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.chain.cache=false